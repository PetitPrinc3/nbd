[[audits.chrono]]
who = "Claude Opus 5.5 x PetitPrinc3 <arthur.reppelin@gmail.com>"
criteria = "safe-to-deploy"
version = "0.4.45"
notes = "Reviewed per the safe-to-deploy criteria: every unsafe block and powerful import. No build script or proc macro. With default features off and now only (std, alloc), two unsafe sites compile: the manual Send impl on the deprecated Date<Tz> matches the auto impl (fields NaiveDate and Tz::Offset), and NaiveDate::from_yof's NonZeroI32::new_unchecked never receives 0, since every caller keeps the year flags (bits 0-2, never zero) through masks that exclude them. The clock feature adds: CStr up to the first NUL, TimeZoneName's from_utf8_unchecked after a strict [0-9A-Za-z+-] check, mem::zeroed on POD Win32 structs, a checked GetTimeZoneInformationForYear; the unchecked assume_init calls in windows.rs are test-only. Reading TZ, /etc/localtime and TZif files is clock-only and follows POSIX TZ semantics. RUSTSEC-2020-0159 fixed since 0.4.20. Date arithmetic and formatting logic not reviewed line by line; mozilla audited every delta 0.4.19 -> 0.4.42."

[[audits.futures-task]]
who = "Claude Opus 5.5 x PetitPrinc3 <arthur.reppelin@gmail.com>"
criteria = "safe-to-deploy"
version = "0.3.31"
notes = "No dependencies or build script. ArcWake (Send + Sync) RawWaker vtables are monomorphized per W and keep Arc counts balanced; WakerRef copies are ManuallyDrop and only exposed as &Waker; the noop waker has null data and a no-op vtable. FutureObj erases the lifetime but keeps it in PhantomData; pinning is guaranteed by each UnsafeFutureObj impl (Unpin for &mut F, heap for Box) and drop rebuilds the original box; Send is guarded by F: Send or the unsafe into_future_obj."

[[audits.metrics]]
who = "Claude Opus 5.5 x PetitPrinc3 <arthur.reppelin@gmail.com>"
criteria = "safe-to-deploy"
version = "0.24.6"
notes = '''Full review. No build script, I/O, FFI, environment or process access; only dependency rapidhash. cow.rs reconstructs exactly what it decomposes; the capacity-encoded kind is sound. Cow's Send/Sync bounds would be too weak for Arc-backed T: \!Sync, but Cow is private and only used with str and [Label]. RecorderOnceCell is sound behind set_global_recorder (R: Sync). Discretion: set_default_local_recorder is unsound in safe code (mem::forget on the guard leaves a dangling thread-local recorder, use-after-free reproduced). NBD only installs a global recorder and never calls it and is therefore not affected by the UAF issue.'''

[[audits.metrics-exporter-prometheus]]
who = "Claude Opus 5.5 x PetitPrinc3 <arthur.reppelin@gmail.com>"
criteria = "safe-to-deploy"
version = "0.18.3"
notes = "Reviewed for NBD's features (default features off, http-listener); push-gateway, protobuf and uds-listener paths not reviewed. build.rs only runs prost-build under the protobuf feature. One unsafe, evmap::new_assert_stable, is justified: keys and values hash and compare deterministically. HTTP listener checks the IP allowlist per connection and answers 403; label values escape newlines, quotes and backslashes. Discretion: no hyper timer is set, so there is no header read timeout and no connection limit; any peer, allowed or not, can hold connections open. Keep the endpoint on loopback or behind a firewall."

