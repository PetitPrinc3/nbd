
# cargo-vet audits file

[[audits.arc-swap]]
who = "Claude Opus 5.5 x PetitPrinc3 <arthur.reppelin@gmail.com>"
criteria = "safe-to-deploy"
version = "1.9.5"
notes = "Full review of the 1.9.3 code base (lib, ref_cnt, debt, strategy/hybrid, access, cache, as_raw; weak, serde and rwlock-strategy features) plus the 1.9.3 -> 1.9.5 delta. 1.9.4 tags debts with RefCnt::TAG so Arc and Weak debts on one allocation no longer collide (#214); every debt write and comparison uses Debt::encode and every storing entry point calls check_tag. 1.9.5 keys unconfirmed debts to their storage so writers of other instances skip debts naming a reused address (#210); the helping slot carries the key, the fast path clears it on confirmation, and confirmed helping debts become full counts before load returns, so a moved ArcSwap stays correct. The storage word is published by the SeqCst pointer swap. No new dependency, build script, I/O or FFI. #210 is still open upstream pending the reporter's confirmation; the global SeqCst memory-model argument was not re-derived."

[[audits.metrics]]
who = "Claude Opus 5.5 x PetitPrinc3 <arthur.reppelin@gmail.com>"
criteria = "safe-to-deploy"
version = "0.24.6"
notes = '''Full review. No build script, I/O, FFI, environment or process access; only dependency rapidhash. cow.rs reconstructs exactly what it decomposes; the capacity-encoded kind is sound. Cow's Send/Sync bounds would be too weak for Arc-backed T: \!Sync, but Cow is private and only used with str and [Label]. RecorderOnceCell is sound behind set_global_recorder (R: Sync). Discretion: set_default_local_recorder is unsound in safe code (mem::forget on the guard leaves a dangling thread-local recorder, use-after-free reproduced). NBD only installs a global recorder and never calls it and is therefore not affected by the UAF issue.'''

[[audits.metrics-exporter-prometheus]]
who = "Claude Opus 5.5 x PetitPrinc3 <arthur.reppelin@gmail.com>"
criteria = "safe-to-deploy"
version = "0.18.3"
notes = "Reviewed for NBD's features (default features off, http-listener); push-gateway, protobuf and uds-listener paths not reviewed. build.rs only runs prost-build under the protobuf feature. One unsafe, evmap::new_assert_stable, is justified: keys and values hash and compare deterministically. HTTP listener checks the IP allowlist per connection and answers 403; label values escape newlines, quotes and backslashes. Discretion: no hyper timer is set, so there is no header read timeout and no connection limit; any peer, allowed or not, can hold connections open. Keep the endpoint on loopback or behind a firewall."

[[audits.secrecy]]
who = "Claude Opus 5.5 x PetitPrinc3 <arthur.reppelin@gmail.com>"
criteria = "safe-to-deploy"
version = "0.10.3"
notes = "Full review (204 lines). forbid(unsafe_code), no_std, no build script, depends only on zeroize (serde optional). Debug redacts, zeroize on drop. Known limit: From<String> uses into_boxed_str(), which may reallocate and leave the old buffer unzeroized; deserialization leaves intermediate copies."

[[audits.smallvec]]
who = "Claude Opus 5.5 x PetitPrinc3 <arthur.reppelin@gmail.com>"
criteria = "safe-to-deploy"
delta = "1.16.4 -> 1.16.5"
notes = "Comment reflow and Cargo.toml formatting only, no code change. Publisher alejandro-vaz (crates.io owner) verified: 1.16.5 is tag v1.16.5 on branch v1 of github.com/servo/rust-smallvec (commit 6e900059, PR #853); the published src/lib.rs, README.md and Cargo.toml match that commit byte for byte."

[[audits.tracing]]
who = "Claude Opus 5.5 x PetitPrinc3 <arthur.reppelin@gmail.com>"
criteria = "safe-to-deploy"
delta = "0.1.41 -> 0.1.44"
notes = "Source delta reviewed (619 lines, the rest is generated tests). One new unsafe, from_utf8_unchecked in __macro_support::FieldName::as_str, is sound: FieldName::new only drops ASCII 'r#' pairs from a valid &str and checks the length. Otherwise no_std restructuring and macro refactoring. No build script, I/O or new dependency."

[[audits.tracing-attributes]]
who = "Claude Opus 5.5 x PetitPrinc3 <arthur.reppelin@gmail.com>"
criteria = "safe-to-deploy"
delta = "0.1.30 -> 0.1.31"
notes = "Proc-macro: adds {expr} field names to #[instrument] and removes dead code. Token manipulation only, no I/O or environment access."

[[audits.tracing-subscriber]]
who = "Claude Opus 5.5 x PetitPrinc3 <arthur.reppelin@gmail.com>"
criteria = "safe-to-deploy"
delta = "0.3.20 -> 0.3.23"
notes = "New unsafe blocks only wrap pre-existing downcast_raw calls (unsafe_op_in_unsafe_fn). New with_ansi_sanitization() opt-out: sanitization stays on by default and NBD does not disable it. Span stack no longer clones/closes span refs on enter/exit (safe code). no_std restructuring. No build script or new dependency."

