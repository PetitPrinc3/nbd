[[audits.rdkafka]]
who = "Claude Opus 5.5 x PetitPrinc3 <arthur.reppelin@gmail.com>"
criteria = "safe-to-deploy"
version = "0.39.0"
notes = "Full review of the producer path NBD uses (util, config, client, error, message, producer); consumer, admin, groups, metadata, mocking and topic_partition_list reviewed for risky unsafe patterns, not line by line. No build script. Callbacks go through polled events; only partitioner_cb and the queue-nonempty callbacks run on librdkafka threads. Delivery opaques are reclaimed exactly once, payloads are copied, header ownership follows librdkafka, BorrowedMessage keeps its event alive. Client-before-queue drop order is benign. Discretion: TopicPartitionList::elements(&self) hands out aliasing &mut on a Sync type (data race in safe code; unused by NBD); partitioner_cb builds &mut from the shared context (custom partitioners only); a failed rd_kafka_new leaks the native config, credentials included; KafkaError::ClientConfig prints rejected values, sensitive keys included (unreachable in NBD)."

[[audits.secrecy]]
who = "Claude Opus 5.5 x PetitPrinc3 <arthur.reppelin@gmail.com>"
criteria = "safe-to-deploy"
version = "0.10.3"
notes = "Full review (204 lines). forbid(unsafe_code), no_std, no build script, depends only on zeroize (serde optional). Debug redacts, zeroize on drop. Known limit: From<String> uses into_boxed_str(), which may reallocate and leave the old buffer unzeroized; deserialization leaves intermediate copies."

[[audits.signal-hook-registry]]
who = "Claude Opus 5.5 x PetitPrinc3 <arthur.reppelin@gmail.com>"
criteria = "safe-to-deploy"
delta = "1.4.1 -> 1.4.8"
notes = "Replaces static mut GLOBAL_DATA with a once-initialized, never-freed AtomicPtr (Release/Acquire); saves and restores errno around handler execution (new errno dependency); HashMap/BTreeMap replaced by a Vec-backed map without unsafe, allocating only at registration; function-pointer casts go through *const (). No new unsafe."

[[audits.smallvec]]
who = "Claude Opus 5.5 x PetitPrinc3 <arthur.reppelin@gmail.com>"
criteria = "safe-to-deploy"
delta = "1.15.2 -> 1.16.4"
notes = "retain rewritten after std's Vec::retain_mut (read/write cursors, backshift guard): panics in the predicate or in drop cause no double drop or lost element. push split into inline/heap branches with equivalent bounds. try_grow returns early instead of asserting when new_cap < len, so the buffer never shrinks below len. Adds PhantomData<A::Item> for drop check with may_dangle. Other changes are formatting."

[[audits.smallvec]]
who = "Claude Opus 5.5 x PetitPrinc3 <arthur.reppelin@gmail.com>"
criteria = "safe-to-deploy"
delta = "1.16.4 -> 1.16.5"
notes = "Comment reflow and Cargo.toml formatting only, no code change. Publisher alejandro-vaz (crates.io owner) verified: 1.16.5 is tag v1.16.5 on branch v1 of github.com/servo/rust-smallvec (commit 6e900059, PR #853); the published src/lib.rs, README.md and Cargo.toml match that commit byte for byte."

