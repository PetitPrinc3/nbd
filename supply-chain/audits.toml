
# cargo-vet audits file

[[audits.arc-swap]]
who = "Claude Opus 5.5 x PetitPrinc3 <arthur.reppelin@gmail.com>"
criteria = "safe-to-deploy"
version = "1.9.5"
notes = "Full review of the 1.9.3 code base (lib, ref_cnt, debt, strategy/hybrid, access, cache, as_raw; weak, serde and rwlock-strategy features) plus the 1.9.3 -> 1.9.5 delta. 1.9.4 tags debts with RefCnt::TAG so Arc and Weak debts on one allocation no longer collide (#214); every debt write and comparison uses Debt::encode and every storing entry point calls check_tag. 1.9.5 keys unconfirmed debts to their storage so writers of other instances skip debts naming a reused address (#210); the helping slot carries the key, the fast path clears it on confirmation, and confirmed helping debts become full counts before load returns, so a moved ArcSwap stays correct. The storage word is published by the SeqCst pointer swap. No new dependency, build script, I/O or FFI. #210 is still open upstream pending the reporter's confirmation; the global SeqCst memory-model argument was not re-derived."

