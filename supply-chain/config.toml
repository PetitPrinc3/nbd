[[exemptions.curl-sys]]
version = "0.4.91+curl-8.22.0"
criteria = "safe-to-deploy"
notes = """
Audit policy : Rust and build reviewed, bundled C exempted.
Only built with NBD's `kafka-auth-oauth` feature (librdkafka's OIDC token request).
Rust: lib.rs holds extern declarations, integer aliases for C enums, opaque types and two safe functions, no unsafe code. Neither NBD nor rdkafka-sys calls the declarations: rdkafka-sys only links libcurl through DEP_CURL_ROOT.
build.rs: links the system libcurl when pkg-config (Linux) or vcpkg (Windows MSVC) finds it, otherwise compiles the bundled curl with cc. No network access, writes only under OUT_DIR. It always runs `git submodule update --init curl` in the crate directory (the packaged crate has no curl/.git) and ignores the result.
C: bundled curl is byte-identical to upstream tag curl-8_22_0, commit 01346829096c61b372692f6dc43ffa778c6caccd (755 files compared, tests and docs not shipped). Bundled build: no HTTP/2, TLS through OpenSSL (Linux) or Schannel (Windows). curl 8.23.0 (2026-10-14) fixes 24 CVEs affecting 8.22.0. The High one (CVE-2026-92392, HTTP/2) is not compiled in. The 23 Low ones were triaged by title, and none matched librdkafka's use (http/https only, no redirects, own Authorization header). Update when a curl-sys release bundles curl >= 8.23.0. Tracked separately (CVE watch), not reviewed.
"""

