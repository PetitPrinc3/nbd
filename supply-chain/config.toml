[[exemptions.rdkafka-sys]]
version = "4.10.0+2.12.1"
criteria = "safe-to-deploy"
notes = """
Audit policy : Rust and build reviewed, bundled C exempted.
Rust: src/bindings.rs is bindgen output; its only `unsafe` tokens are `unsafe extern "C" fn` pointer types. The two unsafe blocks in types.rs (Display) are sound: the code is validated with try_from first, and rd_kafka_err2str never returns NULL.
build.rs (cmake-build path, used by NBD): CMake on the bundled librdkafka with tests and examples off, no network access, writes only under target/. The `./configure` path (mklove, can download modules) is not used by NBD.
C: bundled librdkafka is byte-identical to upstream tag v2.12.1, commit e1db7eaa517f0a6438bc846a9c49ede73b9ea211 (698 files compared). No CVE known on 2026-11-10. Tracked separately (CVE watch), not reviewed.
Known issue: rd_kafka_resp_err_t is a #[repr(i32)] Rust enum and librdkafka passes unknown broker error codes through to delivery reports, so a code unknown to librdkafka 2.12.1 is UB (crash observed, fede1024/rust-rdkafka#127). See SECURITY.md.
"""

[[exemptions.sasl2-sys]]
version = "0.1.22+2.1.28"
criteria = "safe-to-deploy"
notes = """
Audit policy : Rust and build reviewed, bundled C exempted.
Only built with NBD's `kafka-auth-gssapi` feature.
Rust: extern declarations, constants and fn-pointer types, no unsafe block. rdkafka-sys only links it (`extern crate sasl2_sys`).
build.rs: NBD leaves `vendored` off, so only find_sasl runs: SASL2_LIB_DIR/SASL2_INCLUDE_DIR or SASL2_DIR, then pkg-config, then /usr and /usr/local. It preprocesses version.c to require libsasl2 2.1.26 to 2.1.28 and links the system library. No network access. The vendored path (copy of sasl2/ into OUT_DIR, configure and make through duct) never runs; deny.toml forbids the feature.
C: system libsasl2 (Cyrus SASL), patched by the distribution. Upstream 2.1.26 and 2.1.27 are affected by CVE-2019-19906 and CVE-2022-24407, fixed in 2.1.28 or by distribution backports.
"""

