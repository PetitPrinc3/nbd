<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 928 492" width="928" height="492" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;Noto Sans&quot;, Helvetica, Arial, sans-serif">
<title id="t">NBD architecture</title>
<desc id="d">Feed senders on the IN network send multicast datagrams; the switch forwards the groups each provider joined (IGMP or MLD). One provider per group receives them on its interface and hands them, without copy, to the ManagedProducer, which produces them to the Kafka broker through librdkafka. A supervisor checks the producer every 500 ms, rebuilds it after a fatal error from the configuration file, refuses any change of the Kafka settings, and hands the old producer to a reaper thread. An optional Prometheus exporter serves the metrics, on 127.0.0.1 by default.</desc>
<style>
  .page{fill:#ffffff;stroke:#d0d7de}
  .cont{fill:#f6f8fa;stroke:#d0d7de;stroke-width:1}
  .box{fill:#ffffff;stroke:#8c959f;stroke-width:1.25}
  .title{font-size:15px;font-weight:600;fill:#1f2328}
  .sub,.line,.ctitle,.lbl,.leg{fill:#59636e}
  .sub,.line,.leg{font-size:11.5px}
  .ctitle{font-size:11.5px;font-weight:600}
  .name{font-size:13px;font-weight:600;fill:#1f2328}
  .lbl{font-size:10.5px}
  .code{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;font-size:10.5px}
  .data{fill:none;stroke:#0969da;stroke-width:1.5}
  .ctl{fill:none;stroke:#59636e;stroke-width:1.25;stroke-dasharray:5 4}
  .mdata{fill:#0969da}
  .mctl{fill:#59636e}
  @media (prefers-color-scheme: dark){
    .page{fill:#0d1117;stroke:#30363d}
    .cont{fill:#161b22;stroke:#30363d}
    .box{fill:#0d1117;stroke:#6e7681}
    .title,.name{fill:#e6edf3}
    .sub,.line,.ctitle,.lbl,.leg{fill:#9198a1}
    .data{stroke:#4493f8}
    .ctl{stroke:#9198a1}
    .mdata{fill:#4493f8}
    .mctl{fill:#9198a1}
  }
</style>
<defs><marker id="a-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="mdata"/></marker><marker id="a-ctl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="mctl"/></marker></defs>
<rect x="0.5" y="0.5" width="927" height="491" rx="12" class="page"/>
<text x="24" y="32" class="title">Each multicast feed reaches Kafka through one supervised producer</text>
<text x="24" y="51" class="sub">NBD 0.2.0 · one provider per <tspan class="code">[[provider]]</tspan> section</text>
<rect x="16" y="68" width="176" height="368" rx="10" class="cont"/>
<text x="28" y="88" class="ctitle">IN network</text>
<rect x="256" y="68" width="416" height="368" rx="10" class="cont"/>
<text x="268" y="88" class="ctitle">NBD host · one process</text>
<rect x="736" y="68" width="176" height="368" rx="10" class="cont"/>
<text x="748" y="88" class="ctitle">Kafka network</text>
<g id="switch">
<rect x="28" y="104" width="152" height="84" rx="8" class="box"/>
<text x="40" y="126" class="name">Switch, querier</text>
<text x="40" y="144" class="line">IGMP / MLD snooping</text>
<text x="40" y="160" class="line">forwards joined</text>
<text x="40" y="176" class="line">groups only</text>
</g>
<g id="feeds">
<rect x="28" y="224" width="152" height="84" rx="8" class="box"/>
<text x="40" y="246" class="name">Feed senders</text>
<text x="40" y="264" class="line">N multicast groups</text>
<text x="40" y="280" class="line">UDP to group:port</text>
</g>
<rect x="280" y="96" width="160" height="84" rx="8" class="box"/>
<rect x="276" y="100" width="160" height="84" rx="8" class="box"/>
<g id="providers">
<rect x="272" y="104" width="160" height="84" rx="8" class="box"/>
<text x="284" y="126" class="name">Providers × N</text>
<text x="284" y="144" class="line">one task per group</text>
<text x="284" y="160" class="line">bound to group:port</text>
<text x="284" y="176" class="line">on its interface only</text>
</g>
<g id="config">
<rect x="272" y="224" width="160" height="84" rx="8" class="box"/>
<text x="284" y="246" class="name">Configuration</text>
<text x="284" y="264" class="line"><tspan class="code">config.toml</tspan>, TLS,</text>
<text x="284" y="280" class="line">keytab, secret files</text>
<text x="284" y="296" class="line">mode, owner checked</text>
</g>
<g id="reaper">
<rect x="272" y="344" width="160" height="72" rx="8" class="box"/>
<text x="284" y="366" class="name">Reaper thread</text>
<text x="284" y="384" class="line">destroys retired</text>
<text x="284" y="400" class="line">producers off-runtime</text>
</g>
<g id="managed">
<rect x="488" y="104" width="168" height="84" rx="8" class="box"/>
<text x="500" y="126" class="name">ManagedProducer</text>
<text x="500" y="144" class="line">shared by all providers</text>
<text x="500" y="160" class="line">holds the librdkafka</text>
<text x="500" y="176" class="line">producer (generation n)</text>
</g>
<g id="supervisor">
<rect x="488" y="224" width="168" height="84" rx="8" class="box"/>
<text x="500" y="246" class="name">Supervisor</text>
<text x="500" y="264" class="line">checks every 500 ms</text>
<text x="500" y="280" class="line">rebuilds on fatal error</text>
<text x="500" y="296" class="line">refuses changed settings</text>
</g>
<g id="exporter">
<rect x="488" y="344" width="168" height="72" rx="8" class="box"/>
<text x="500" y="366" class="name">Metrics exporter</text>
<text x="500" y="384" class="line">only if <tspan class="code">[metrics]</tspan> is set</text>
<text x="500" y="400" class="line">127.0.0.1 by default</text>
</g>
<g id="broker">
<rect x="748" y="104" width="152" height="84" rx="8" class="box"/>
<text x="760" y="126" class="name">Kafka broker</text>
<text x="760" y="144" class="line">topic set per provider</text>
<text x="760" y="160" class="line">TLS, SASL</text>
</g>
<g id="kdc">
<rect x="748" y="224" width="152" height="84" rx="8" class="box"/>
<text x="760" y="246" class="name">KDC, IdP</text>
<text x="760" y="264" class="line">Kerberos, OAuth</text>
<text x="760" y="280" class="line">if configured</text>
</g>
<g id="prom">
<rect x="748" y="344" width="152" height="72" rx="8" class="box"/>
<text x="760" y="366" class="name">Prometheus</text>
<text x="760" y="384" class="line">remote scrape is</text>
<text x="760" y="400" class="line">opt-in</text>
</g>
<path d="M104.0 224V190" class="data" marker-end="url(#a-data)"/>
<text x="112.0" y="210" class="lbl">multicast</text>
<path d="M180 134H270" class="data" marker-end="url(#a-data)"/>
<text x="224" y="126" class="lbl" text-anchor="middle">datagrams</text>
<path d="M440 134H486" class="data" marker-end="url(#a-data)"/>
<text x="464" y="126" class="lbl" text-anchor="middle">Bytes</text>
<text x="464" y="150" class="lbl" text-anchor="middle">no copy</text>
<path d="M656 134H746" class="data" marker-end="url(#a-data)"/>
<text x="704" y="126" class="lbl" text-anchor="middle">produce</text>
<path d="M272 166H182" class="ctl" marker-end="url(#a-ctl)"/>
<text x="224" y="182" class="lbl" text-anchor="middle">join</text>
<path d="M656 166H704V266H746" class="ctl" marker-end="url(#a-ctl)"/>
<text x="710" y="232" class="lbl">auth</text>
<path d="M432 266H486" class="ctl" marker-end="url(#a-ctl)"/>
<text x="464" y="258" class="lbl" text-anchor="middle">re-read</text>
<path d="M572 224V190" class="ctl" marker-end="url(#a-ctl)"/>
<text x="580" y="210" class="lbl">swaps</text>
<path d="M518 308V326H352.0V342" class="ctl" marker-end="url(#a-ctl)"/>
<text x="435.0" y="320" class="lbl" text-anchor="middle">old producer</text>
<path d="M748 380H658" class="ctl" marker-end="url(#a-ctl)"/>
<text x="704" y="372" class="lbl" text-anchor="middle">scrape</text>
<path d="M24 464H56" class="data"/>
<text x="64" y="468" class="leg">data path</text>
<path d="M152 464H184" class="ctl"/>
<text x="192" y="468" class="leg">control</text>
</svg>
