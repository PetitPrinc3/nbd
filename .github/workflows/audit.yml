name: Audit

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule: 
    - cron: '0 6 * * *'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Lints, tests and supply chain
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install the build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libsasl2-dev cmake

      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      - name: Install the audit tools (pinned versions)
        run: cargo install --locked cargo-audit@0.22.2 cargo-deny@0.20.2 cargo-hack@0.6.45 cargo-vet@0.10.3

      - name: Format
        run: cargo fmt -- --check
      - name: Known vulnerabilities
        run: cargo audit
      - name: Licences and sources
        run: cargo deny check
      - name: Supply chain
        run: cargo vet --locked
      - name: Clippy on every feature combination, tests included
        run: cargo hack clippy --locked --feature-powerset --all-targets -- -D warnings
      - name: Unit and configuration tests on every feature combination
        run: |
          cargo hack test --locked --feature-powerset --lib
          cargo hack test --locked --feature-powerset --test config

  outdated:
    name: Outdated dependencies
    runs-on: ubuntu-24.04
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: Install cargo-outdated (pinned version)
        run: cargo install --locked cargo-outdated@0.19.0
      - name: Outdated dependencies
        run: cargo outdated --exit-code 1
