name: Audit

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Format
      run: cargo fmt
    - name: Add auditing/building tools
      run: |
        cargo install cargo-audit cargo-outdated cargo-deny
        sudo apt-get update
        sudo apt-get install -y libcurl4-openssl-dev libsasl2-dev
        rustup component add clippy
    - name: Update
      run: cargo update
    - name: Update check
      run: cargo outdated
    - name: Audit
      run: cargo audit
    - name: Clippy
      run: cargo clippy -- -D warnings
    - name: Deny
      run: cargo deny check
    - name: Build
      run: cargo build
