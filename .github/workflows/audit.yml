name: Audit

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Format check
      run: cargo fmt -- --check
    - name: Add auditing/building tools
      run: |
        cargo install cargo-audit cargo-outdated cargo-deny cargo-hack
        sudo apt-get update
        sudo apt-get install -y libcurl4-openssl-dev libsasl2-dev
        rustup component add clippy
    - name: Version check
      run: cargo outdated --exit-code 1
    - name: Audit check
      run: cargo audit
    - name: Cargo check
      run: cargo check --all-features
    - name: Clippy (all feature combinations, tests included)
      run: cargo hack clippy --feature-powerset --all-targets -- -D warnings
    - name: Unit tests
      run: cargo hack test --lib --feature-powerset
    - name: Deny check
      run: cargo deny check
    - name: Build
      run: cargo build --release --all-features
