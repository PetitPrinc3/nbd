name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Add build tools
      run: |
        sudo apt-get update
        sudo apt-get install -y libcurl4-openssl-dev libsasl2-dev
    - name: Format
      run: cargo fmt -- --check
    - name: Build
      run: cargo build --release --all-features
  
  build-windows:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    - name: Run tests
      run: cargo test
    - name: Build
      run: cargo build --release --features metrics-exporter